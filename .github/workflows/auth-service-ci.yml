# =============================================================================
# Auth Service CI/CD
# =============================================================================
# GitHub Actions workflow для микросервиса аутентификации JobScout.
#
# Триггеры:
#   - push в main / develop (только при изменениях в services/auth-service/**)
#   - pull_request в main (только при изменениях в services/auth-service/**)
#
# Джобы:
#   1. lint-and-test  — линт + unit-тесты + сборка (с PostgreSQL 16 и Redis 7)
#   2. security-scan  — Trivy (файлы) + npm audit (high+)
#   3. docker-build   — сборка и пуш образа в DockerHub (только main)
#
# Секреты (Settings → Secrets → Actions):
#   - DOCKER_USERNAME, DOCKER_PASSWORD
#   - CODECOV_TOKEN (опционально)
# =============================================================================

name: Auth Service CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/auth-service/**'
      - 'docker-compose.yml'  # сервис зависит от compose файла
  pull_request:
    branches: [ main ]
    paths:
      - 'services/auth-service/**'
      - 'docker-compose.yml'  # сервис зависит от compose файла

# Отменяем предыдущий запуск при новом push в ту же ветку
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Сужаем права токена GITHUB_TOKEN
permissions:
  contents: read
  security-events: write      # для upload-sarif (Trivy)
  pull-requests: write        # для комментариев в PR (опционально)


# Глобальные переменные окружения для всех джобов
env:
  WORKING_DIRECTORY: services/auth-service # Рабочая директория сервиса
  NODE_VERSION: '22'
  # POSTGRES_PASSWORD, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET
  # (объявлены, но нигде не использовались — мёртвый груз) 
  # пока не используем, чтобы не хранить секреты в workflow
  # POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  # JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
  # JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

jobs:
 # ---------------------------------------------------------------------------
 # Джоба 1: Линт, тесты, сборка
 # ---------------------------------------------------------------------------
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15 # защита от зависания джоба, если что-то пойдет не так

    # Сервисные контейнеры, доступные джобе во время выполнения
    services:
      # PostgreSQL 16 для тестов
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobscout_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Redis 7 для тестов
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Ставим Node.js с кэшем npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      # 3. Чистая установка зависимостей (по package-lock.json)
      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci --legacy-peer-deps # npm ci по умолчанию ставит и prod, и dev

      # 4. Линтинг кода (ESLint) + unit-тесты
      - name: Lint
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run lint

      # 5. Unit-тесты (Jest)
      - name: Unit tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm test

      # 6. Сборка сервиса (TypeScript -> nest build → dist/auth-service)
      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run build

      # 7. Загрузка покрытия в Codecov (опционально)
      - name: Upload coverage
        if: ${{ secrets.CODECOV_TOKEN != '' }} # Только если токен Codecov существует, а если нет то не поадааем
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Токен Codecov если существует то явно передаем
          directory: ${{ env.WORKING_DIRECTORY }}/coverage # Путь к покрытию
          flags: auth-service # Флаги для Codecov
          name: auth-service-coverage # Имя для Codecov
          fail_ci_if_error: false # Codecov не валит пайплайн если ошибка, а просто выводит ошибку
          
  # ---------------------------------------------------------------------------
  # Джоба 2: Сканирование безопасности
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15  # защита от зависания джоба, если что-то пойдет не так

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
       
      # Trivy — сканер уязвимостей в файлах (package-lock.json и т.д.) + npm audit (high+)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0 # v0.28.0 — последняя стабильная версия Trivy
        with:
          scan-type: 'fs' # filesystem scan для сканирования файлов
          scan-ref: ${{ env.WORKING_DIRECTORY }} # Рабочая директория сервиса
          format: 'sarif' # SARIF format для GitHub Security
          output: 'trivy-results.sarif' # Файл для загрузки в GitHub Code Scanning
          severity: 'CRITICAL,HIGH' # Критические и высокие уязвимости

      # Загрузка результатов в SARIF в GitHub Security tab (для GitHub Actions)
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      # npm audit — проверка известных уязвимостей в зависимостях (high+)
      - name: Run npm audit
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm audit --audit-level=high || true
        # || true — продолжаем выполнение джоба даже если npm audit найдет уязвимости
  # ---------------------------------------------------------------------------
  # Джоба 3: Сборка и пуш Docker образа
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15  # защита от зависания джоба, если что-то пойдет не так
    needs: [lint-and-test, security-scan] # теперь ждём и security-scan
    # Ждем успешного выполнения джобы 1, после успешного lint-and-test и security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Только для push в main
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Настройка Docker Buildx — расширенный docker build (кэш, multi-arch) для сборки образов
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Логин в DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Сборка и пуш образа с двумя тегами: latest и по SHA коммита (для rollback)
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          push: true
          tags: |
            jobscout/auth-service:latest
            jobscout/auth-service:${{ github.sha }}
          cache-from: type=gha # кэш из GitHub Actions
          cache-to: type=gha,mode=max # кэш в GitHub Actions
